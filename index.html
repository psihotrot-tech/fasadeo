<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fasadeo</title>
<meta name="theme-color" content="#383e42">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: radni alat komercijaliste, miran i precizan
   IDEA: radni sto sa fasadom – od fotografije do ponude
   PICTURE: 3D model i fotografija su glavni prostor svake strane
   COLOUR and TYPE: greige, topla bela, antracit; Archivo + Inter
   LAYOUT: gornja traka sa koracima, sadržaj u jednoj koloni, alat preko cele širine */
:root{--bg:#f3f0ea;--paper:#fff;--ink:#23262a;--soft:#5d6268;--line:#ddd6cb;--an:#383e42;--acc:#b8893f;--ok:#2e7d4f;--bad:#b3261e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;margin:0 0 8px;line-height:1.1}
h2{font-size:24px}h3{font-size:17px;margin-top:18px}
p{margin:0 0 10px;max-width:72ch}
.top{position:sticky;top:0;z-index:20;background:var(--an);color:#fff}
.top .bar{display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font:800 20px Archivo,sans-serif;letter-spacing:.2px}
.logo span{color:#d9b778}
.pname{color:#cfc8bb;font-size:14px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:#a9b0b5}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
nav.tabs button{flex:none;background:none;border:0;color:#cfd3d6;font:500 14px Inter,sans-serif;padding:10px 12px;min-height:44px;cursor:pointer;border-bottom:3px solid transparent}
nav.tabs button.on{color:#fff;border-color:#d9b778}
nav.tabs button:disabled{opacity:.4;cursor:default}
main{max-width:1240px;margin:0 auto;padding:20px max(3vw,14px) 60px}
section.tab{display:none}section.tab.on{display:block}
#t-m3:not(.on){display:block;position:absolute;left:-99999px;top:0;width:1100px;visibility:hidden;pointer-events:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--soft)}
label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;min-height:36px}
input,select,textarea{font:16px Inter,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-height:40px}
input[type=checkbox],input[type=radio]{min-height:auto;width:20px;height:20px;accent-color:var(--an)}
input[type=color]{padding:2px;width:56px}
textarea{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
button,.btn{font:600 14px Inter,sans-serif;min-height:42px;padding:0 16px;border-radius:6px;border:1px solid var(--an);background:var(--an);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button.sec,.btn.sec{background:#fff;color:var(--an)}
button.ghost{background:none;border-color:var(--line);color:var(--ink)}
button.danger{background:#fff;color:var(--bad);border-color:#e3b9b5}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc)}
.note{font-size:13px;color:var(--soft)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f0ebe2;font:600 13px Archivo,sans-serif}
td.n,th.n{text-align:right;white-space:nowrap}
td input,td select{min-height:34px;padding:4px 6px;width:100%;font-size:15px}
.scroll{overflow-x:auto}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.pcard .th{aspect-ratio:16/10;background:#e7e2d8 center/cover no-repeat}
.pcard .tx{padding:12px;flex:1}
.pcard .ac{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.pcard .ac button{min-height:36px;padding:0 10px;font-size:13px}
.view3d{position:relative;height:min(72vh,640px);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#dfe6ec}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.toolbar button{min-height:38px;padding:0 12px}
.info{position:absolute;left:10px;bottom:10px;max-width:min(380px,calc(100% - 20px));background:#ffffffee;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scard{border:2px solid var(--line);border-radius:8px;padding:14px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font:inherit;display:block;min-height:auto}
.scard.on{border-color:var(--acc);box-shadow:0 0 0 3px #b8893f33;background:#fff;color:var(--ink)}
.scard b{font:700 17px Archivo,sans-serif;display:block;margin-bottom:4px}
.pal{display:flex;gap:10px;flex-wrap:wrap}
.pal button{background:#fff;color:var(--ink);border-color:var(--line);padding:6px 12px 6px 6px}
.pal button.on{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px #b8893f33}
.sw{width:30px;height:30px;border-radius:4px;border:1px solid #0002;display:inline-block}
.photoWrap{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#222;touch-action:none}
.photoWrap canvas{display:block;width:100%;height:auto;cursor:crosshair}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps>li{counter-increment:s;position:relative;padding:0 0 14px 44px}
.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--an);color:#fff;display:grid;place-items:center;font:700 14px Archivo,sans-serif}
.fix{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0}
.fix code{flex:1;font-size:13px;white-space:pre-wrap;background:#f6f3ee;padding:6px 8px;border-radius:4px}
.ba{position:relative;border-radius:8px;overflow:hidden;user-select:none}
.ba img{display:block;width:100%}
.ba .topimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 0 0 var(--x,50%))}
.ba .bar2{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:#fff;transform:translateX(-50%);pointer-events:none}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--an);color:#fff;padding:10px 16px;border-radius:6px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{padding:30px;text-align:center;color:var(--soft)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#efe9de;color:var(--soft)}
.facesel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#printArea{display:none}
@media(max-width:720px){.two{grid-template-columns:minmax(0,1fr)}h2{font-size:21px}.view3d{height:60vh}}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;padding:10mm;font-size:12px}#printArea table{font-size:11px}#printArea th{background:#eee}}
</style>
</head>
<body>
<div class="top">
  <div class="bar"><div class="logo">Fasa<span>deo</span></div><div class="pname" id="pname">Nema otvorenog projekta</div><div class="saved" id="saved"></div></div>
  <nav class="tabs" id="tabs">
    <button data-t="pr" class="on">Projekti</button>
    <button data-t="ob">1. Objekat</button>
    <button data-t="fo">2. Fotografija</button>
    <button data-t="st">3. Elementi</button>
    <button data-t="m3">4. 3D model</button>
    <button data-t="sp">5. Specifikacija i ponuda</button>
    <button data-t="vz">6. Vizualizacija</button>
    <button data-t="ku">7. Za kupca</button>
    <button data-t="pd">Podešavanja</button>
  </nav>
</div>
<main>
<section class="tab on" id="t-pr"></section>
<section class="tab" id="t-ob"></section>
<section class="tab" id="t-fo"></section>
<section class="tab" id="t-st"></section>
<section class="tab" id="t-m3">
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">3D model</h2><span class="note" id="m3note"></span></div>
  <div class="toolbar" id="m3tools">
    <button data-v="iso" class="sec">3D</button><button data-v="front" class="sec">Spreda</button><button data-v="right" class="sec">Desno</button><button data-v="left" class="sec">Levo</button><button data-v="back" class="sec">Pozadi</button><button data-v="top" class="sec">Odozgo</button>
    <button id="tglMold" class="on">Lajsne</button><button id="tglGlass" class="on">Staklo</button>
  </div>
  <div class="view3d"><div id="m3view" style="position:absolute;inset:0"></div><div class="info" id="m3info"><b>Dodirni element</b><br><span class="note">Okretanje: prevuci · zum: točkić ili dva prsta · mere u cm</span></div></div>
</section>
<section class="tab" id="t-sp"></section>
<section class="tab" id="t-vz"></section>
<section class="tab" id="t-ku"></section>
<section class="tab" id="t-pd"></section>
</main>
<div id="printArea"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

function dbPut(p){MEM[p.id]=p;if(!DB)return Promise.resolve();return new Promise(ok=>{const t=DB.transaction('p','readwrite');t.objectStore('p').put(p);t.oncomplete=ok;t.onerror=ok;});}

function spec(){const e=engine();if(!e)return [];const rows=[];
  Object.keys(e.BOM).forEach(k=>{const base=k.split('@')[0],it0=CAT[base];if(!it0)return;const L=e.BOM[k];const mR=/@R(\d+)/.exec(k),mA=/@A([\d.]+)x([\d.]+)/.exec(k);let it=it0;
    if(mR||mA){const v=[];if(mA)v.push(`prilagođen ${mA[1]} × ${mA[2]} cm (standard ${it0.h} × ${it0.d})`);if(mR)v.push(`po radijusu R = ${mR[1]} cm`);it=Object.assign({},it0,{bomKey:k,vp:null,variant:v.join(', '),radius:mR?+mR[1]:null,adjH:mA?+mA[1]:null,adjD:mA?+mA[2]:null});}
    if(it.kind==='panel'||it.jm==='kom'){rows.push({it,net:L.length,qty:L.length,jm:'kom',pos:e.POS[k]||e.POS[base]||[]});}
    else if(mR){const net=L.reduce((a,b)=>a+b,0)/100;rows.push({it,net,qty:Math.ceil(net*10)/10,jm:'m´',radius:+mR[1],pos:(e.POS[k]||[]).concat((e.POS[k.replace(/@R\d+/,'')]||[]).filter(t=>/luk|radijus/i.test(t)))});}
    else{const net=L.reduce((a,b)=>a+b,0)/100,bars=FasadaEngine.bars(L);rows.push({it,net,bars,qty:bars*2,jm:'m´',pos:e.POS[k]||[]});}});
  const ord={venac:0,ploca:1,kvader:1,okvir:2,panel:3,konzola:4,ukras:5,baluster:6,telo:7,kapitel:8,stopa:9};rows.sort((a,b)=>(ord[a.it.kind]??9)-(ord[b.it.kind]??9)||a.it.sifra.localeCompare(b.it.sifra)||(a.radius?1:0)-(b.radius?1:0));
  rows.forEach(r=>{const rab=SET[r.it.r]!=null?+SET[r.it.r]:0;r.rab=rab;r.cena=r.it.vp;r.bruto=(r.it.vp||0)*r.qty;r.neto=r.bruto*(1-rab/100);});return rows;}

  ${g.roof.type!=='flat'?`<p class="note" style="margin-top:8px">Kod kosog krova venac ide ispod strehe, po vrhu zidova, i preko osnove zabata. Nadgradnja se ne crta.</p>

  <div class="card"><h3 style="margin-top:0">Zaobljeni uglovi</h3><p class="note">Ugao kuće u luku, cele visine. Venac, atika, pojas, sokla i lajsne prate luk; u specifikaciji idu kao lajsne po radijusu (po upitu).${g.wing&&g.wing.on?' <b>Za sada samo bez krila.</b>':''}</p>

  <div class="card"><h3 style="margin-top:0">Ispusti i erkeri</h3><p class="note">Deo izbačen iz fasade: lučni, pravougaoni (rizalit), kosi ili poligonalni. Bez visina = cele visine (ulazi u venac i atiku). Sa visinama = erker, sa svojom lajsnom po vrhu (pojas ili venac) i po dnu (obrub ili pojas). Kod pravih oblika svaka strana ispusta ima svoje otvore – unose se u „Otvori po stranama“ (Ispust 1 – čelo, bokovi). Na lučnom ispustu prozori još nisu podržani.</p>

  ${g.manual.map((m,i)=>`<tr><td>${esc(m.sifra)}</td><td>${esc(({front:'spreda',left:'levo',right:'desno',back:'pozadi',wf:'krilo spreda',ws:'krilo bok'})[m.face]||m.face)}</td><td>${m.mode==='free'?`slobodno, ${Math.round(m.x)} / ${Math.round(m.y)} cm`:({below:'ispod prozora',above:'iznad prozora',between:'između dva prozora'})[m.mode]}</td><td><button class="ghost" data-mndel="${i}" aria-label="Obriši">✕</button></td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="card"><h3 style="margin-top:0">Balkoni na fasadi</h3><p class="note">Konzolna ploča ispred zida (npr. balkon ili ploča iznad ulaza). „Visina poda“ = gornja ivica ploče od tla. Prozori/vrata iza balkona se unose normalno kao otvori.</p>

  <p class="note" style="margin-top:8px">Krilo je poravnato sa ${g.wing.side==='right'?'desnom':'levom'} ivicom kuće. Njegov spoljni bok je nastavak ${g.wing.side==='right'?'desne':'leve'} strane, pa se otvori na toj strani mere od njenog levog ugla gledano spolja. Otvore na čelu i unutrašnjem boku krila upiši ispod, pod „Krilo – čelo“ i „Krilo – bok“.</p>`:''}</div>
  <div class="card"><label class="ck"><input type="checkbox" data-pc="geo.porch.on"${g.porch.on?' checked':''}> <b>Trem sa stubovima spreda</b></label>
  ${g.porch.on?`<div class="grid">${num('geo.porch.w','Širina ploče','cm')}${num('geo.porch.d','Ispust ploče','cm')}${num('geo.porch.bd','Dubina terase','cm')}${num('geo.porch.cs','Stub','cm')}${num('geo.porch.ci','Uvučenost stuba','cm')}<label>Sredina trema od levo (cm)<input type="number" data-p="geo.porch.cx" value="${g.porch.cx==null?'':g.porch.cx}" placeholder="sredina fasade"></label></div>
  <label class="ck"><input type="checkbox" data-pc="geo.porch.balcony"${g.porch.balcony!==false?' checked':''}> Terasa na spratu između stubova</label>${g.porch.balcony!==false?`<label class="ck"><input type="checkbox" data-pc="geo.porch.open"${g.porch.open?' checked':''}> Terasa bez krova – stubovi samo u prizemlju, terasa nosi ogradu</label>`:''}`:''}</div>
  ${g.roof.type!=='flat'?'':`<div class="card"><label class="ck"><input type="checkbox" data-pc="geo.pent.on"${g.pent.on?' checked':''}> <b>Nadgradnja na krovu</b></label>
  ${g.pent.on?`<div class="grid">${num('geo.pent.w','Širina','cm')}${num('geo.pent.d','Dubina','cm')}${num('geo.pent.h','Visina zida','cm')}${num('geo.pent.z','Udaljenost od fronta','cm')}<label>Sredina od levo (cm)<input type="number" data-p="geo.pent.cx" value="${g.pent.cx==null?'':g.pent.cx}" placeholder="sredina"></label></div>
  <h3>Otvori na prednjoj strani nadgradnje</h3>${opTable(g.pent.openings,'pent')}`:''}</div>`}
  <div class="card"><h3 style="margin-top:0">Otvori po stranama</h3><div class="facesel">${Object.entries(facesForOb(g)).map(([k,n])=>`<button class="${OBF===k?'':'sec'}" data-face="${k}">${n} (${g.faces[k].openings.length})</button>`).join('')}</div>
  ${opTable(g.faces[facesForOb(g)[OBF]?OBF:(OBF='front')].openings,OBF)}</div>
  <div class="row"><button id="obNext">Dalje: fotografija →</button><button class="sec" id="obSkip">Preskoči na elemente →</button></div>`;
  const T=$('t-ob');
  T.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{const v=i.type==='number'?(i.value===''?null:+i.value):i.value;set(i.dataset.p,v);if(i.tagName==='SELECT'&&/roof\.type|wing\.side/.test(i.dataset.p)){touch();rOb();return;}if(i.dataset.p==='name'||i.dataset.p==='client')$('pname').textContent=P.name+(P.client?' · '+P.client:'');touch();});
  T.querySelectorAll('[data-pc]').forEach(i=>i.onchange=()=>{set(i.dataset.pc,i.checked);touch();rOb();});
  const lst=k=>k==='pent'?P.geo.pent.openings:P.geo.faces[k].openings;
  T.querySelectorAll('[data-op]').forEach(i=>i.onchange=()=>{const o=lst(i.dataset.op)[+i.dataset.i];const kk=i.dataset.k;if((kk==='fr'||kk==='par'||kk==='grp'||kk==='fb')&&!i.value)delete o[kk];else o[kk]=(kk==='t'||kk==='arch'||kk==='fr'||kk==='par'||kk==='grp'||kk==='fb')?i.value:+i.value;touch();});
  T.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{lst(b.dataset.del).splice(+b.dataset.i,1);touch();rOb();});
  T.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const L=lst(b.dataset.add),l=L[L.length-1];L.push(l?{t:l.t,x:l.x+l.w+100,y:l.y,w:l.w,h:l.h}:{t:'w',x:100,y:80,w:100,h:140});touch();rOb();});
  T.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{OBF=b.dataset.face;rOb();});
  T.querySelectorAll('[data-dm]').forEach(i=>i.onchange=()=>{const d=P.geo.dormers[+i.dataset.dm],k=i.dataset.k;if(k==='flush'){if(i.value)d.flush=true;else delete d.flush;touch();rOb();return;}d[k]=i.tagName==='SELECT'?i.value:+i.value;touch();});
  T.querySelectorAll('[data-bk]').forEach(i=>i.onchange=()=>{const b=P.geo.balconies[+i.dataset.bk],k=i.dataset.k;b[k]=i.tagName==='SELECT'?i.value:+i.value;touch();});
  T.querySelectorAll('[data-rnd]').forEach(x=>x.onchange=()=>{const k=x.dataset.rnd;P.geo.rounds=(P.geo.rounds||[]).filter(q=>q.corner!==k);if(x.checked)P.geo.rounds.push({corner:k,R:150});touch();rOb();});
  T.querySelectorAll('[data-rndr]').forEach(x=>x.onchange=()=>{const r=P.geo.rounds.find(q=>q.corner===x.dataset.rndr);if(r)r.R=Math.max(20,+x.value||150);touch();});
  T.querySelectorAll('[data-by]').forEach(x=>x.onchange=()=>{const b=P.geo.bays[+x.dataset.by],k=x.dataset.k;if(x.tagName==='SELECT')b[k]=x.value;else if(x.value==='')delete b[k];else b[k]=+x.value;if(k==='shape'){if(b.shape!=='arc'&&!b.w)b.w=Math.round((b.R||150)*2);if(b.shape==='arc'&&!b.R)b.R=Math.round((b.w||300)/2);if(!b.dep)b.dep=b.shape==='arc'?b.R:80;}touch();if(k==='shape')rOb();});
  T.querySelectorAll('[data-bydel]').forEach(b=>b.onclick=()=>{P.geo.bays.splice(+b.dataset.bydel,1);touch();rOb();});
  if($('byAdd'))$('byAdd').onclick=()=>{P.geo.bays.push({side:'front',x:Math.round((P.geo.W||1000)/2),R:150,dep:150});touch();rOb();};

  if($('dmAdd'))$('dmAdd').onclick=()=>{const L=P.geo.dormers,l=L[L.length-1];L.push(l?Object.assign({},l,{x:Math.min(P.geo.W-100,l.x+300)}):{side:'front',x:Math.round(P.geo.W/2),w:90,h:110,arch:''});touch();rOb();};
  $('obNext').onclick=()=>go('fo');$('obSkip').onclick=()=>go('st');}

/* ================= TAB: Fotografija (označavanje) ================= */
let FOF='front',MODE='scale',drag=null,selM=-1,IMG=null;
function mk(){P.marks[FOF]=P.marks[FOF]||{scale:null,known:108,outline:null,items:[]};return P.marks[FOF];}
function rFo(){const m=mk(),ph=P.photos[FOF];
  const FN=facesFor(P.geo);if(!FN[FOF])FOF='front';
  $('t-fo').innerHTML=`<h2>2. Fotografija i mere</h2><p class="note">Učitaj frontalnu fotografiju strane. Označi razmeru (dve tačke poznate mere, najbolje cela širina zida). Po želji dodaj i „Visinsku meru“ (npr. visina vrata 210 cm ili od tla do ploče sprata) – ona ispravlja uspravne mere kada fotografija nije snimljena sasvim ravno. Zatim označi konturu zida (od tla do ispod atike) i otvore. Program računa mere i upisuje ih u objekat.</p>
  <div class="facesel">${Object.entries(FN).map(([k,n])=>`<button class="${FOF===k?'':'sec'}" data-ff="${k}">${n}${P.photos[k]?' ✓':''}</button>`).join('')}</div>
  <div class="card"><div class="row"><label>Fotografija (${FN[FOF]})<input type="file" accept="image/*" id="foFile"></label>${ph?'<button class="danger" id="foDel">Ukloni fotografiju</button>':''}</div></div>
  ${ph?`<div class="toolbar" id="foModes">
    <button data-m="scale">1. Razmera</button><button data-m="vscale">Visinska mera</button><button data-m="outline">2. Kontura zida</button><button data-m="w">Prozor</button><button data-m="wa">Lučni prozor</button><button data-m="d">Vrata</button><button data-m="sel">Izaberi / obriši</button>
    <label style="flex-direction:row;align-items:center;gap:6px">poznata mera <input type="number" id="foKnown" value="${m.known}" style="width:90px"> cm</label><label style="flex-direction:row;align-items:center;gap:6px">visinska <input type="number" id="foVKnown" value="${m.vknown||210}" style="width:80px"> cm</label>${m.vscale?'<button class="ghost" id="foVDel">ukloni visinsku</button>':''}
  </div>
  <div class="photoWrap"><canvas id="foCv"></canvas></div>
  <div class="row" style="margin-top:10px"><button class="danger" id="foDelSel">Obriši izabrano</button><button class="sec" id="foClr">Obriši sve oznake</button><span class="note" id="foStat"></span></div>
  <div class="card" style="margin-top:12px"><label class="ck"><input type="checkbox" id="foSetDim" checked> Upiši ${({front:'širinu objekta',back:'širinu objekta',wf:'širinu krila',ws:'ispust krila'})[FOF]||'dubinu objekta'} iz konture</label>
  <label class="ck"><input type="checkbox" id="foSetH"> Upiši visinu 1. sprata iz konture (visina prizemlja i dodatnih spratova ostaje)</label>
  <div class="row"><button id="foApply">Primeni na objekat</button><span class="note">Posle primene mere možeš ispraviti u koraku 1.</span></div></div>`:'<div class="empty card">Nema fotografije za ovu stranu. Fotografija nije obavezna – mere možeš upisati ručno u koraku 1.</div>'}`;
  const T=$('t-fo');T.querySelectorAll('[data-ff]').forEach(b=>b.onclick=()=>{FOF=b.dataset.ff;selM=-1;rFo();});
  $('foFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;P.photos[FOF]=await shrink(await readFile(f),1800,.86);P.marks[FOF]=null;touch(false);rFo();};
  if(!ph)return;$('foDel').onclick=()=>{delete P.photos[FOF];P.marks[FOF]=null;touch(false);rFo();};
  IMG=new Image();IMG.onload=()=>{const c=$('foCv');c.width=IMG.width;c.height=IMG.height;c.style.maxWidth=Math.round(innerHeight*.75*IMG.width/IMG.height)+'px';c.style.display='block';c.style.margin='0 auto';draw();};IMG.src=ph;
  const setMode=x=>{MODE=x;T.querySelectorAll('#foModes [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===x));};setMode(m.scale?(m.outline?'w':'outline'):'scale');
  T.querySelectorAll('#foModes [data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $('foKnown').onchange=e=>{m.known=+e.target.value;touch(false);draw();};
  $('foVKnown').onchange=e=>{m.vknown=+e.target.value;touch(false);draw();};if($('foVDel'))$('foVDel').onclick=()=>{m.vscale=null;touch(false);rFo();};
  $('foDelSel').onclick=()=>{if(selM>=0){m.items.splice(selM,1);selM=-1;touch(false);draw();}};
  $('foClr').onclick=()=>{P.marks[FOF]=null;mk();selM=-1;touch(false);draw();};
  $('foApply').onclick=applyMarks;
  const cv=$('foCv');const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(e);

function addSeries(fk,n,w,h,fi,yp,x0,gap){const g=P.geo,F=floors(g),len=faceLen(g,fk),L=g.faces[fk].openings,K=CAT[P.styleCfg.okvir];

  else{const m=Math.max(60,cornerZone()+(K?K.h:0)+20),av=len-2*m;for(let k=0;k<n;k++)xs.push(r5(m+(k+.5)*av/n-w/2));}

function copyFloor(fk,from,to){const g=P.geo,F=floors(g),L=g.faces[fk].openings,src=F[from],tg=to==='all'?F.map((_,i)=>i).filter(i=>i>from):[+to];let n=0;

    L.splice(0,L.length,...L.filter(o=>!(o.y>=f.y0&&o.y<f.y0+f.h&&o.t!=='d')));
    items.forEach(o=>{const hh=Math.min(o.h,f.h-(o.y-src.y0)-20);if(hh<40)return;L.push(Object.assign({},o,{y:o.y+dy,h:hh}));n++;});});

const vnum=n=>{const m=/gemini-(\d+)(?:\.(\d+))?/.exec(n);return m?(+m[1])*100+(+(m[2]||0)):0;};
async function pickModelEx(kind,tried){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':SET.gkey}});const j=await r.json().catch(()=>({}));
  const L=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).filter(n=>!tried.has(n));

async function pickModel(kind,excl){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':SET.gkey}});const j=await r.json().catch(()=>({}));
  const L=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''));
  const ok=kind==='img'?L.filter(n=>/^gemini-[\d.]+-flash-image$/.test(n)):L.filter(n=>/^gemini-[\d.]+-flash$/.test(n));
  const alt=kind==='img'?L.filter(n=>/flash.*image/.test(n)&&!/preview/.test(n)):L.filter(n=>/^gemini-[\d.]+-flash-lite$/.test(n));

const BUSY=/high demand|overloaded|UNAVAILABLE|try again later|503/i;
const DAYQ=/per ?day|PerDay|exceeded your current quota/i;
async function gem(model,parts,cfg,retried){for(let k=0;k<3;k++){try{return await gem0(model,parts,cfg);}catch(e){
  if(DAYQ.test(e.message||'')){const kind=model===SET.gImg?'img':'txt';const tried=(gem._q=gem._q||new Set());tried.add(model);
    const alt=await pickModelEx(kind,tried).catch(()=>null);if(alt){if(kind==='img')SET.gImg=alt;else SET.gTxt=alt;try{saveSet();}catch(x){}toast('Dnevna besplatna kvota za '+model+' je potrošena – prelazim na '+alt);return gem(alt,parts,cfg,retried);}
    throw new Error('Besplatna dnevna kvota Google-a je potrošena za sve dostupne modele. Obnavlja se sutra, ili u AI Studio uključi plaćanje (prepoznavanje košta delić dinara po fotografiji).');}if(!BUSY.test(e.message||'')||k===2){if(BUSY.test(e.message||'')&&!retried){const alt=await pickModel(model===SET.gImg?'img':'txt',model).catch(()=>null);if(alt&&alt!==model){toast('Model je zauzet, pokušavam sa '+alt);return gem(alt,parts,cfg,true);}throw new Error('Google-ov model je trenutno preopterećen. Sačekaj 1–2 minuta i pokušaj ponovo.');}if(BUSY.test(e.message||''))throw new Error('Google-ov model je trenutno preopterećen. Sačekaj 1–2 minuta i pokušaj ponovo.');return gem1(model,parts,cfg,retried,e);}toast('Google je zauzet, pokušavam ponovo…');await new Promise(r=>setTimeout(r,2500*(k+1)));}}}
async function gem1(model,parts,cfg,retried,e){{
  if(retried||!/no longer available|not found|is not supported|deprecated|unknown model/i.test(e.message))throw e;
  const kind=model===SET.gImg?'img':'txt';let nm=null;const sug=/models\/(gemini-[\w.-]+)/.exec(e.message.replace('models/'+model,''));

  if(kind==='img')SET.gImg=nm;else SET.gTxt=nm;try{saveSet();}catch(x){}toast('Model zamenjen: '+nm);return gem(nm,parts,cfg,true);}}
async function gem0(model,parts,cfg){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':SET.gkey},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:cfg||{}})});

  if(pk==='venac'){if(!pit){if(it.h>A.atika)no(`viši od atike (${A.atika} cm)`);else if(it.h<A.atika*.45)r.note.push('nizak za ovu atiku');r.score=Math.abs(it.h/A.atika-.8);}

  if(pk==='rustika'){const need=rw+2*it.d+Kw+pov+10;if(A.cd<Infinity&&A.cd<need)no(`do prvog otvora ima ${f(A.cd)} cm (${A.cdAt}), treba ${f(need)} cm`);r.score=Math.abs(it.d-4.5)/10+Math.abs(it.h-31.5)/60;}
  if(pk==='okvir'){const w=it.h,pv=PA?parOvC(P.styleCfg):0;
    if(A.gx<Infinity&&A.gx<2*(w+pv))no(`razmak između prozora ${f(A.gx)} cm (${A.gxAt}), treba ${f(2*(w+pv))} cm`);
    if(c.okvirMode==='single'&&A.gy<Infinity&&A.gy<2*w+parH)no(`između prozora jedan iznad drugog ima ${f(A.gy)} cm, treba ${f(2*w+parH)} cm`);
    if(Y&&A.cd<Infinity&&A.cd<band+w+pv+10)no(`preblizu rustike na uglu (${A.cdAt})`);

    if(PA&&PA.d<=it.d)r.note.push('dublji od parapeta');r.score=Math.abs(w/A.winAvg-.13)*4+(PA&&PA.d<=it.d?1:0);}
  if(pk==='parapet'){const ov=-parDBot(it)+parUser(P.styleCfg);
    if(A.gx<Infinity&&A.gx<2*(Kw+ov))no(`razmak između prozora ${f(A.gx)} cm, treba ${f(2*(Kw+ov))} cm`);

    if(above&&A.tsp<Infinity&&A.tsp<Kw+it.h+venS)no('nema mesta iznad gornjih prozora');

    if(!A.stacks.length)no('nema prozora jedan iznad drugog');else if(!n)no(`ne staje (najveći razmak ${f(Math.max(...A.stacks.map(s=>s.gap)))} cm)`);else r.note.push(`staje na ${n} mesta`);r.score=Math.abs(it.w/A.winAvg-.85);}
  if(pk==='pojas'){if(it.h>35)no('previsok za pojas');r.score=Math.abs(it.h-15)/20;}
  if(pk==='rustika'&&it.kind==='kvader'){r.ok=true;r.why=[];const need=Math.max(it.w,it.h)+it.d+Kw+pov+10;if(A.cd<Infinity&&A.cd<need)no(`do prvog otvora ima ${f(A.cd)} cm (${A.cdAt}), treba ${f(need)} cm za dug blok`);r.score=Math.abs(Math.max(it.w,it.h)-50)/40;}
  if(pk==='stubTelo'||pk==='stubKapitel'||pk==='stubStopa'){if(!P.geo.porch.on)no('kuća nema trem sa stubovima');else{const CS=P.geo.porch.cs||70,T=CAT[pk==='stubTelo'?it.sifra:c.stubTelo],sq=T&&T.shape==='square',Dd=c.stubD||Math.max(40,Math.ceil((sq?CS+4:CS*1.42+2)/5)*5),k=Dd/40;
      if(pk!=='stubTelo'){r.note.push(`u modelu ${Math.round(it.h*k*10)/10} cm visine (${Math.round(k*100)}%)`);r.score=Math.abs(it.h*k-Dd*.4)/20;}else r.score=it.flutes?1:0;}}

function invBox(p){const c=P.styleCfg;if(!['venac','okvir','parapet','pojas','soklaLajsna','atikaL','obrub'].includes(p.k)||!c[p.k])return '';const on=c.inv&&c.inv[p.k];
